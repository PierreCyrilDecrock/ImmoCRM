# Publie le site sur GitHub Pages à chaque fusion dans main,
# après avoir vérifié la qualité du code, les tests et la construction.
name: Déploiement

on:
  push:
    branches: [main]
  # Permet de relancer une publication à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois ; celle en cours va toujours au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Variable facultative du dépôt (Settings → Secrets and variables → Actions → Variables).
          # Absente, le site est construit pour https://<compte>.github.io/ImmoCRM/.
          BASE_PATH: ${{ vars.BASE_PATH }}
          # Variables obligatoires du dépôt (même endroit) : adresse et clé PUBLIQUE du projet
          # Supabase réel. Jamais la clé d'administration (service_role).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_CLE_PUBLIQUE: ${{ vars.VITE_SUPABASE_CLE_PUBLIQUE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publication sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
